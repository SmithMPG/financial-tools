<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Dashboard — Financial Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'" />
    <link rel="icon" type="image/svg+xml" href="resources/favicon.svg" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --navy: #0a0f1e;
        --navy-2: #0f172a;
        --navy-3: #1e293b;
        --navy-4: #334155;
        --gold: #d4a843;
        --white: #f1f5f9;
        --muted: #94a3b8;
        --dim: #64748b;
        --fd: "Playfair Display", Georgia, serif;
        --fb: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: #e2e3e4;
        min-height: 100dvh;
        font-family: var(--fb);
        -webkit-font-smoothing: antialiased;
        color: var(--navy-3);
      }

      /* ── Top bar ─────────────────────────────────────────────────────────── */
      .topbar {
        background: #0b1221;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 0.6rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 10;
        gap: 1rem;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-shrink: 0;
      }

      .topbar-logo img {
        width: 20px;
        height: 20px;
      }

      .topbar-title {
        font-family: var(--fd);
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--white);
        white-space: nowrap;
      }

      .topbar-title span {
        color: var(--gold);
      }

      .topbar-center {
        width: 45%;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-shrink: 0;
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-shrink: 0;
      }

      .advisor-name {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .btn-signout {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.5rem;
        color: var(--muted);
        cursor: pointer;
        font-family: var(--fb);
        font-size: 0.8rem;
        padding: 0.4rem 0.8rem;
        transition: background 0.15s;
      }

      .btn-signout:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--white);
      }

      /* ── Main layout ─────────────────────────────────────────────────────── */
      .outer {
        margin: 0 auto;
        padding: 1.5rem 2rem 4rem;
        display: flex;
        flex-direction: column;
      }

      /* ── Search + New client bar ─────────────────────────────────────────── */
      .controls {
        display: flex;
        gap: 0.75rem;
      }

      .search-wrap {
        flex: 1;
        position: relative;
      }

      .search-icon {
        position: absolute;
        left: 0.9rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--dim);
        pointer-events: none;
        font-size: 0.95rem;
      }

      .search-input {
        width: 100%;
        background: #0b1221;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.75rem;
        color: var(--white);
        font-family: var(--fb);
        font-size: 0.95rem;
        padding: 0.7rem 0.9rem 0.7rem 2.5rem;
        outline: none;
        transition: border-color 0.15s;
        box-shadow: 0 4px 12px rgba(11, 18, 33, 0.2);
      }

      .search-input:focus {
        border-color: rgba(212, 168, 67, 0.4);
      }
      .search-input::placeholder {
        color: var(--dim);
      }

      .btn-new {
        background: var(--gold);
        border: none;
        border-radius: 0.75rem;
        color: var(--navy);
        cursor: pointer;
        font-family: var(--fb);
        font-size: 0.9rem;
        font-weight: 700;
        padding: 0.7rem 1.25rem;
        white-space: nowrap;
        transition:
          opacity 0.15s,
          transform 0.1s;
        box-shadow: 0 4px 12px rgba(11, 18, 33, 0.2);
      }

      .btn-new:hover {
        opacity: 0.9;
      }
      .btn-new:active {
        transform: scale(0.98);
      }

      /* ── Client cards ────────────────────────────────────────────────────── */
      .client-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .client-card {
        background: #0b1221;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 0.75rem;
        padding: 0.85rem 1.25rem;
        display: flex;
        align-items: center;
        gap: 0;
        box-shadow: 0 4px 12px rgba(11, 18, 33, 0.15);
        transition: border-color 0.15s;
        position: relative;
        overflow: hidden;
      }

      .client-card:hover {
        border-color: rgba(212, 168, 67, 0.25);
      }

      .client-col {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
        padding: 0 1rem;
        border-right: 1px solid rgba(255, 255, 255, 0.06);
      }

      .client-col:first-child {
        padding-left: 0;
      }
      .client-col:last-child {
        border-right: none;
        padding-right: 0;
      }

      .client-col-name {
        flex: 1.4;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.25rem;
      }

      .client-col-email {
        flex: 1.8;
      }
      .client-col-phone {
        flex: 1.4;
      }

      .client-col-actions {
        flex-shrink: 0;
        gap: 0.5rem;
        border-right: none;
      }

      .client-name {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--white);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .lead-card-row {
        display: flex;
        align-items: stretch;
        gap: 0.75rem;
        width: 100%;
      }
      .lead-source-col {
        width: 225px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1221;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 0.75rem;
        padding: 0.85rem 1rem;
        box-shadow: 0 4px 12px rgba(11, 18, 33, 0.15);
        font-family: var(--fb);
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--white);
        white-space: nowrap;
        text-align: center;
      }
      .lead-card-row .client-card {
        flex: 1;
        min-width: 0;
      }

      .client-col-time {
        flex: 0 0 auto;
        width: 3.75rem;
        justify-content: center;
        padding-left: 0;
      }
      .time-label {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--gold);
        cursor: pointer;
        padding: 0.15rem 0.35rem;
        border-radius: 0.3rem;
        transition: background 0.15s;
      }
      .time-label:hover {
        background: rgba(212, 168, 67, 0.12);
      }
      .time-label-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--gold);
        opacity: 0.8;
        cursor: pointer;
        padding: 0.15rem 0.35rem;
        border-radius: 0.3rem;
      }

      .date-divider {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        padding: 1rem 0 0.4rem;
      }
      .date-divider:first-child {
        padding-top: 0.25rem;
      }
      .date-divider-label {
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        white-space: nowrap;
      }
      .date-divider-line {
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.07);
      }


      .col-value {
        font-size: 0.82rem;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }

      .col-empty {
        font-size: 0.82rem;
        color: var(--navy-4);
        font-style: italic;
      }

      .btn-copy-field {
        background: transparent;
        border: none;
        border-radius: 0.3rem;
        color: var(--dim);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.2rem;
        flex-shrink: 0;
        transition: color 0.15s;
        line-height: 1;
      }

      .btn-copy-field:hover {
        color: var(--muted);
      }
      .btn-copy-field.copied {
        color: #86efac;
      }

      .btn-contact {
        background: transparent;
        border: none;
        border-radius: 0.3rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.2rem;
        flex-shrink: 0;
        transition: color 0.15s;
        line-height: 1;
      }
      .btn-contact-wa  { color: #4ade80; }
      .btn-contact-wa:hover  { color: #86efac; }
      .btn-contact-mail { color: var(--white); opacity: 0.6; }
      .btn-contact-mail:hover { opacity: 1; }

      .btn-action {
        border-radius: 0.5rem;
        cursor: pointer;
        font-family: var(--fb);
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0.45rem 0.85rem;
        transition:
          opacity 0.15s,
          background 0.15s;
        white-space: nowrap;
      }

      .btn-meeting {
        background: var(--gold);
        border: none;
        color: var(--navy);
      }

      .btn-meeting:hover {
        opacity: 0.88;
      }

      .btn-link {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--muted);
      }

      .btn-link:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--white);
      }
      .btn-link.copied {
        color: #86efac;
        border-color: rgba(34, 197, 94, 0.3);
      }

      /* ── Empty state ─────────────────────────────────────────────────────── */
      .empty {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--muted);
      }

      .empty p {
        font-size: 0.9rem;
        margin-top: 0.5rem;
      }

      /* ── Modal ───────────────────────────────────────────────────────────── */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 1rem;
      }

      .modal-backdrop.open {
        display: flex;
      }

      .modal {
        background: #0b1221;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.25rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        padding: 2rem;
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .modal h2 {
        font-family: var(--fd);
        font-size: 1.2rem;
        color: var(--white);
      }

      .modal-fields {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
      }

      .modal label {
        display: block;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.35rem;
      }

      .modal input {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.6rem;
        color: var(--white);
        font-family: var(--fb);
        font-size: 0.9rem;
        padding: 0.65rem 0.85rem;
        outline: none;
        transition: border-color 0.15s;
      }

      .modal input:focus {
        border-color: rgba(212, 168, 67, 0.5);
      }
      .modal input::placeholder {
        color: var(--dim);
      }

      .modal textarea {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.6rem;
        color: var(--white);
        font-family: var(--fb);
        font-size: 0.9rem;
        padding: 0.65rem 0.85rem;
        outline: none;
        resize: vertical;
        min-height: 140px;
        transition: border-color 0.15s;
      }

      .modal textarea:focus {
        border-color: rgba(212, 168, 67, 0.5);
      }
      .modal textarea::placeholder {
        color: var(--dim);
      }

      .modal-row {
        display: flex;
        gap: 0.65rem;
        align-items: stretch;
      }
      .modal-row > div {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      #modal.single-col .modal-row {
        flex-direction: column;
        gap: 0.85rem;
      }

      .modal select {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.6rem;
        color: var(--white);
        font-family: var(--fb);
        font-size: 0.9rem;
        padding: 0.65rem 0.85rem;
        outline: none;
        cursor: pointer;
        transition: border-color 0.15s;
        color-scheme: dark;
      }
      .modal select:focus {
        border-color: rgba(212, 168, 67, 0.5);
      }

      .time-selects {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        height: 100%;
      }
      .time-selects select {
        flex: 1;
        height: 100%;
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        text-align: center;
        text-align-last: center;
        padding-left: 0;
        padding-right: 0;
      }
      .time-sep {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--muted);
        flex-shrink: 0;
      }

      .modal-actions {
        display: flex;
        gap: 0.6rem;
      }

      .btn-cancel {
        flex: 1;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.6rem;
        color: var(--muted);
        cursor: pointer;
        font-family: var(--fb);
        font-size: 0.9rem;
        padding: 0.6rem 1.1rem;
      }

      .btn-save {
        flex: 1;
        background: var(--gold);
        border: none;
        border-radius: 0.6rem;
        color: var(--navy);
        cursor: pointer;
        font-family: var(--fb);
        font-size: 0.9rem;
        font-weight: 700;
        padding: 0.6rem 1.25rem;
        transition: opacity 0.15s;
      }

      .btn-save:hover {
        opacity: 0.88;
      }
      .btn-save:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }


      .modal-error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 0.5rem;
        color: #fca5a5;
        font-size: 0.82rem;
        padding: 0.55rem 0.8rem;
        display: none;
      }

      .modal-error.visible {
        display: block;
      }

      /* ── Chevron button ──────────────────────────────────────────────────────── */
      .btn-chevron {
        background: transparent;
        border: none;
        color: var(--navy-4);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.3rem 0.25rem;
        flex-shrink: 0;
        border-radius: 0.35rem;
        transition: color 0.15s;
        position: relative;
      }

      .btn-chevron:hover {
        color: var(--muted);
      }

      /* ── Dim overlay ─────────────────────────────────────────────────────────── */
      .row-dim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0);
        z-index: 200;
        pointer-events: none;
        transition: background 0.2s;
      }

      .row-dim.open {
        background: rgba(0, 0, 0, 0.55);
        pointer-events: all;
      }

      /* ── Floating row action panel ───────────────────────────────────────────── */
      .row-panel {
        position: fixed;
        right: 0;
        z-index: 201;
        background: #0b1221;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-right: none;
        border-radius: 0.75rem 0 0 0.75rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.6rem 3.25rem 0.6rem 1rem;
        box-shadow: -8px 0 32px rgba(0, 0, 0, 0.4);
        transform: translateX(110%);
        transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .row-panel.open {
        transform: translateX(0);
      }

      .btn-menu-action {
        border-radius: 0.5rem;
        cursor: pointer;
        font-family: var(--fb);
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0.45rem 0.9rem;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        transition:
          background 0.15s,
          border-color 0.15s;
      }

      .btn-menu-delete {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.25);
        color: #fca5a5;
        overflow: hidden;
        position: relative;
      }

      .btn-menu-delete:hover {
        background: rgba(239, 68, 68, 0.18);
        border-color: rgba(239, 68, 68, 0.4);
      }

      .btn-menu-edit {
        background: rgba(212, 168, 67, 0.08);
        border: 1px solid rgba(212, 168, 67, 0.25);
        color: var(--gold);
      }
      .btn-menu-edit:hover {
        background: rgba(212, 168, 67, 0.16);
        border-color: rgba(212, 168, 67, 0.45);
      }


      /* ── Questionnaire dot ───────────────────────────────────────────────────── */
      .unread-corner {
        position: absolute;
        top: -24px;
        right: -24px;
        width: 48px;
        height: 48px;
        background: #ef4444;
        transform: rotate(45deg);
        pointer-events: none;
      }

      /* ── Tab bar ─────────────────────────────────────────────────────────────── */
      .tab-bar {
        display: flex;
        background: #d4d6d8;
        padding: 0.45rem 0;
      }

      .tab {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.7rem 1rem;
        font-size: 0.82rem;
        font-weight: 500;
        color: #555c6a;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
        border-radius: 0;
        transition: color 0.15s;
        position: relative;
        z-index: 0;
      }

      .tab-no-move {
        flex: 0 0 auto;
        padding: 0.7rem 0.9rem;
        opacity: 0.6;
      }
      .tab-no-move:hover {
        opacity: 1;
      }
      .tab-no-move.active {
        opacity: 1;
      }

      .tab:not(:last-child)::after {
        content: "";
        position: absolute;
        right: 0;
        top: 20%;
        height: 60%;
        width: 1px;
        background: rgba(0, 0, 0, 0.12);
      }

      .tab.active::after,
      .tab.active + .tab::after {
        display: none;
      }

      .tab:hover:not(.active) {
        color: #2a3040;
      }

      .tab.active {
        background: #ffffff;
        color: #0a0f1e;
        font-weight: 600;
        z-index: 1;
        box-shadow:
          0 4px 18px rgba(0, 0, 0, 0.22),
          0 1px 4px rgba(0, 0, 0, 0.12);
        border-radius: 0.25rem;
        margin: -0.3rem 0.4rem;
        padding: 0.9rem 1rem;
      }

      .tab.drag-over {
        background: rgba(212, 168, 67, 0.25);
        color: #7a5a10;
      }

      .tab-count {
        background: rgba(0, 0, 0, 0.1);
        border-radius: 99px;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 0.1rem 0.45rem;
        color: inherit;
        min-width: 1.4rem;
        text-align: center;
        transition: background 0.15s;
      }

      .tab.active .tab-count {
        background: rgba(10, 15, 30, 0.08);
      }

      .client-card.dragging {
        opacity: 0.35;
        cursor: grabbing;
      }

      .client-card {
        cursor: grab;
      }

      /* ── Custom drag ghost ───────────────────────────────────────────────────── */
      .drag-ghost-el {
        position: fixed;
        z-index: 9999;
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: #0b1221;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 0.6rem;
        padding: 0.5rem 0.9rem;
        font-family: var(--fb);
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--muted);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s,
          border-radius 0.15s,
          padding 0.15s;
        white-space: nowrap;
      }

      .drag-ghost-el.is-drop {
        background: #052a14;
        border-color: #22c55e;
        color: #4ade80;
        border-radius: 50%;
        padding: 0.7rem;
        font-size: 0;
        gap: 0;
      }

      .drag-ghost-el .ghost-label {
        transition: opacity 0.12s;
      }
      .drag-ghost-el.is-drop .ghost-label {
        opacity: 0;
        width: 0;
        overflow: hidden;
      }

      .drag-ghost-el .ghost-arrow {
        display: none;
        color: #4ade80;
      }
      .drag-ghost-el.is-drop .ghost-arrow {
        display: flex;
      }
      .btn-menu-delete.confirming {
        background: rgba(239, 68, 68, 0.2);
        border-color: rgba(239, 68, 68, 0.5);
      }

      .delete-state {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        white-space: nowrap;
        transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .confirm-state {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        white-space: nowrap;
        transform: translateX(100%);
        transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .btn-menu-delete.confirming .delete-state {
        transform: translateX(-100%);
      }
      .btn-menu-delete.confirming .confirm-state {
        transform: translateX(0);
      }

      /* ── Topbar profile button ───────────────────────────────────────────────── */
      .topbar-profile-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1.5px solid rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        cursor: pointer;
        width: 32px;
        height: 32px;
        padding: 0;
        overflow: hidden;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: border-color 0.15s;
      }
      .topbar-profile-btn:hover {
        border-color: var(--gold);
      }
      .topbar-profile-btn img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .topbar-profile-btn span {
        font-size: 0.68rem;
        font-weight: 700;
        color: var(--gold);
      }

      /* ── Profile modal avatar ────────────────────────────────────────────────── */
      .profile-avatar-wrap {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 2px dashed rgba(255, 255, 255, 0.2);
        cursor: pointer;
        margin: 0 auto 0.25rem;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.04);
        transition: border-color 0.15s;
        flex-shrink: 0;
      }
      .profile-avatar-wrap:hover {
        border-color: var(--gold);
      }
      .profile-avatar-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
      }
      .profile-avatar-initials {
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--gold);
      }
      .profile-avatar-hint {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.68rem;
        color: var(--white);
        opacity: 0;
        transition: opacity 0.15s;
        text-align: center;
        padding: 0.5rem;
        border-radius: 50%;
      }
      .profile-avatar-wrap:hover .profile-avatar-hint {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- Top bar -->
    <div class="topbar">
      <div class="topbar-left">
        <img class="topbar-logo" src="resources/logo.svg" alt="" />
        <span class="topbar-title">The <span>Steward</span></span>
      </div>
      <div class="topbar-center">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input class="search-input" type="search" id="search" placeholder="Search clients…" oninput="filterClients()" />
        </div>
        <button class="btn-new" onclick="openModal()">+ New Client</button>
      </div>
      <div class="topbar-right">
        <button class="topbar-profile-btn" id="topbar-profile-btn" onclick="openProfileModal()" title="Edit profile">
          <img id="topbar-avatar-img" src="" alt="" style="display: none" />
          <span id="topbar-avatar-initials"></span>
        </button>
        <span class="advisor-name" id="advisor-name"></span>
        <button class="btn-signout" onclick="signOut()">Sign out</button>
      </div>
    </div>

    <!-- Tab bar -->
    <div class="tab-bar" id="tab-bar">
      <div class="tab tab-no-move" data-tab="leads" title="Leads — questionnaire submissions from new contacts">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
        <span class="tab-count" id="count-leads">0</span>
      </div>
      <div class="tab active" data-tab="upcoming">Upcoming Meetings <span class="tab-count" id="count-upcoming">0</span></div>
      <div class="tab" data-tab="action-you">Action Required <span class="tab-count" id="count-action-you">0</span></div>
      <div class="tab" data-tab="action-client">Waiting on Client <span class="tab-count" id="count-action-client">0</span></div>
      <div class="tab" data-tab="clients">Clients <span class="tab-count" id="count-clients">0</span></div>
      <div class="tab tab-no-move" data-tab="no-move" title="Did Not Move Forward">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
        </svg>
        <span class="tab-count" id="count-no-move">0</span>
      </div>
    </div>

    <!-- Main -->
    <div class="outer">
      <div class="client-list" id="client-list">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- New client modal -->
    <div class="modal-backdrop" id="modal">
      <div class="modal">
        <h2>New Client</h2>
        <div class="modal-fields">
          <div>
            <label for="m-first">First Names</label>
            <input type="text" id="m-first" placeholder="e.g. Jane Anne" />
          </div>
          <div>
            <label for="m-last">Surname</label>
            <input type="text" id="m-last" placeholder="e.g. Smith" />
          </div>
          <div>
            <label for="m-email">Email</label>
            <input type="email" id="m-email" placeholder="jane@example.com" />
          </div>
          <div>
            <label for="m-phone">Phone</label>
            <input type="tel" id="m-phone" placeholder="+27 82 000 0000" />
          </div>
          <div>
            <label for="m-notes">Notes <span style="text-transform:none;font-weight:400;letter-spacing:normal">(optional)</span></label>
            <textarea id="m-notes" placeholder="Any notes about this client…"></textarea>
          </div>
        </div>
        <div class="modal-error" id="modal-error"></div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button class="btn-save" id="btn-save" onclick="createClient()">Create Client</button>
        </div>
      </div>
    </div>

    <!-- Meeting date modal (shown when dragging to Upcoming) -->
    <div class="modal-backdrop" id="meeting-date-modal">
      <div class="modal">
        <h2>Schedule Meeting</h2>
        <div class="modal-fields">
          <div class="modal-row">
            <div>
              <label for="md-date">Date</label>
              <input type="date" id="md-date" />
            </div>
            <div>
              <label>Time</label>
              <div class="time-selects">
                <select id="md-hour"></select>
                <span class="time-sep">:</span>
                <select id="md-min"></select>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-error" id="md-error"></div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeMeetingDateModal()">Close</button>
          <button class="btn-cancel" id="md-clear-btn" onclick="clearMeetingDate()" style="display:none;color:#fca5a5;border-color:rgba(239,68,68,0.25)">Clear</button>
          <button class="btn-save" id="md-save-btn" onclick="confirmMeetingDate()">Confirm</button>
        </div>
      </div>
    </div>

    <!-- Profile modal -->
    <div class="modal-backdrop" id="profile-modal">
      <div class="modal">
        <h2>My Profile</h2>
        <div class="profile-avatar-wrap" onclick="document.getElementById('profile-photo-input').click()">
          <img id="profile-avatar-img" src="" alt="" style="display: none" />
          <span id="profile-avatar-initials" class="profile-avatar-initials"></span>
          <div class="profile-avatar-hint">Click to change photo</div>
          <input type="file" id="profile-photo-input" accept="image/*" style="display: none" />
        </div>
        <div class="modal-fields">
          <div>
            <label for="p-name">Display Name</label>
            <input type="text" id="p-name" placeholder="e.g. Jane Smith" />
          </div>
          <div>
            <label for="p-phone">Phone Number</label>
            <input type="tel" id="p-phone" placeholder="+27 82 000 0000" />
          </div>
          <div>
            <label for="p-linkedin">LinkedIn URL</label>
            <input type="url" id="p-linkedin" placeholder="https://linkedin.com/in/yourprofile" />
          </div>
        </div>
        <div class="modal-error" id="profile-error"></div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeProfileModal()">Cancel</button>
          <button class="btn-save" id="profile-save-btn" onclick="saveProfile()">Save Changes</button>
        </div>
      </div>
    </div>

    <!-- Notes modal -->
    <div class="modal-backdrop" id="notes-modal">
      <div class="modal">
        <h2>Notes</h2>
        <div class="modal-fields">
          <div>
            <textarea id="notes-text" placeholder="Type any notes about this client…"></textarea>
          </div>
        </div>
        <div class="modal-error" id="notes-error"></div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeNotesModal()">Cancel</button>
          <button class="btn-save" id="notes-save-btn" onclick="saveNotes()">Save Notes</button>
        </div>
      </div>
    </div>

    <!-- Dim + floating row action panel -->
    <div class="row-dim" id="row-dim" onclick="closeRowPanel()"></div>
    <div class="row-panel" id="row-panel">
      <button class="btn-menu-action btn-menu-delete" id="row-panel-delete">
        <span class="delete-state">
          Delete
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6" />
          </svg>
        </span>
        <span class="confirm-state">
          Confirm
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6" />
          </svg>
        </span>
      </button>
      <button class="btn-menu-action btn-menu-edit" id="row-panel-edit" onclick="openEditModal()">
        Edit
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
        </svg>
      </button>
      <button class="btn-menu-action btn-menu-edit" id="row-panel-questionnaire" onclick="openQuestionnaire()">
        Open Tool
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
      <button class="btn-menu-action btn-menu-edit" id="row-panel-notes" onclick="openNotesModal()">
        Notes
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 3h16v14H8l-4 4z"/>
        </svg>
      </button>
      <button class="btn-chevron" onclick="closeRowPanel()" title="Close">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>
    </div>

    <script type="module">
      import { supabase } from "./resources/supabase.js";

      // ── Auth guard ────────────────────────────────────────────────────────────
      const {
        data: { session },
      } = await supabase.auth.getSession();
      if (!session) {
        location.href = "./login.html";
      }

      const advisorId = session.user.id;


      // ── Load advisor profile ──────────────────────────────────────────────────
      const { data: advisor } = await supabase.from("advisors").select("name, company_name, logo_url, phone, linkedin_url").eq("id", advisorId).single();

      let advisorProfile = advisor || {};

      function getInitials(str) {
        return (
          (str || "")
            .split(" ")
            .map((p) => p[0])
            .join("")
            .slice(0, 2)
            .toUpperCase() || "?"
        );
      }

      function applyAdvisorToTopbar() {
        const displayName = advisorProfile.name || advisorProfile.company_name || session.user.email;
        document.getElementById("advisor-name").textContent = displayName;
        const img = document.getElementById("topbar-avatar-img");
        const inits = document.getElementById("topbar-avatar-initials");
        if (advisorProfile.logo_url) {
          img.src = advisorProfile.logo_url;
          img.style.display = "";
          inits.style.display = "none";
        } else {
          img.style.display = "none";
          inits.style.display = "";
          inits.textContent = getInitials(displayName);
        }
      }

      applyAdvisorToTopbar();

      // ── Profile modal ─────────────────────────────────────────────────────────
      let _pendingPhotoFile = null;

      window.openProfileModal = function () {
        document.getElementById("p-name").value = advisorProfile.name || "";
        document.getElementById("p-phone").value = advisorProfile.phone || "";
        document.getElementById("p-linkedin").value = advisorProfile.linkedin_url || "";

        const img = document.getElementById("profile-avatar-img");
        const inits = document.getElementById("profile-avatar-initials");
        if (advisorProfile.logo_url) {
          img.src = advisorProfile.logo_url;
          img.style.display = "";
          inits.style.display = "none";
        } else {
          img.style.display = "none";
          inits.style.display = "";
          inits.textContent = getInitials(advisorProfile.name || advisorProfile.company_name || session.user.email);
        }

        _pendingPhotoFile = null;
        document.getElementById("profile-photo-input").value = "";
        document.getElementById("profile-error").classList.remove("visible");
        document.getElementById("profile-modal").classList.add("open");
      };

      window.closeProfileModal = function () {
        document.getElementById("profile-modal").classList.remove("open");
        _pendingPhotoFile = null;
      };

      document.getElementById("profile-photo-input").addEventListener("change", function () {
        const file = this.files[0];
        if (!file) return;
        _pendingPhotoFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = document.getElementById("profile-avatar-img");
          const inits = document.getElementById("profile-avatar-initials");
          img.src = e.target.result;
          img.style.display = "";
          inits.style.display = "none";
        };
        reader.readAsDataURL(file);
      });

      window.saveProfile = async function () {
        const name = document.getElementById("p-name").value.trim();
        const phone = document.getElementById("p-phone").value.trim();
        const linkedin = document.getElementById("p-linkedin").value.trim();
        const saveBtn = document.getElementById("profile-save-btn");
        const errEl = document.getElementById("profile-error");

        errEl.classList.remove("visible");
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";

        let logoUrl = advisorProfile.logo_url || null;

        if (_pendingPhotoFile) {
          const ext = _pendingPhotoFile.name.split(".").pop();
          const path = `${advisorId}/avatar.${ext}`;
          const { error: uploadError } = await supabase.storage.from("advisor-photos").upload(path, _pendingPhotoFile, { upsert: true, contentType: _pendingPhotoFile.type });

          if (uploadError) {
            errEl.textContent = "Photo upload failed: " + uploadError.message;
            errEl.classList.add("visible");
            saveBtn.disabled = false;
            saveBtn.textContent = "Save Changes";
            return;
          }

          const {
            data: { publicUrl },
          } = supabase.storage.from("advisor-photos").getPublicUrl(path);
          logoUrl = publicUrl;
        }

        const { error } = await supabase
          .from("advisors")
          .update({ name: name || null, phone: phone || null, linkedin_url: linkedin || null, logo_url: logoUrl })
          .eq("id", advisorId);

        if (error) {
          errEl.textContent = error.message;
          errEl.classList.add("visible");
          saveBtn.disabled = false;
          saveBtn.textContent = "Save Changes";
          return;
        }

        advisorProfile = { ...advisorProfile, name, phone, linkedin_url: linkedin, logo_url: logoUrl };
        // Force browser to reload the image if URL didn't change
        if (logoUrl) document.getElementById("topbar-avatar-img").src = logoUrl + "?t=" + Date.now();
        applyAdvisorToTopbar();

        saveBtn.disabled = false;
        saveBtn.textContent = "Save Changes";
        closeProfileModal();
      };

      document.getElementById("profile-modal").addEventListener("click", function (e) {
        if (e.target === this) closeProfileModal();
      });

      // ── Load clients ──────────────────────────────────────────────────────────
      let allClients = [];

      async function loadClients() {
        const { data, error } = await supabase
          .from("clients")
          .select("id, first_name, last_name, email, phone, meeting_date, meeting_time, tab, source, questionnaire_unread, questionnaire_submitted_at, notes")
          .order("created_at", { ascending: false });

        if (error) {
          console.error(error);
          return;
        }
        allClients = data || [];
        updateTabCounts();
        renderClients(allClients);
      }

      function buildCard(c) {
        const name = `${c.first_name} <span style="font-weight:400;color:var(--muted)">${c.last_name}</span>`;
        const emailVal = c.email ? c.email.replace(/'/g, "\\'") : "";
        const phoneVal = c.phone ? c.phone.replace(/'/g, "\\'") : "";
        const waNum    = c.phone ? c.phone.replace(/\D/g, "").replace(/^0/, "27") : "";
        const calIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
        const timeCol = `<div class="client-col client-col-time">
               ${
                 c.meeting_date && c.meeting_time
                   ? `<span class="time-label" onclick="openMeetingDateModal('${c.id}', '${c.meeting_date}', '${c.meeting_time}')">${c.meeting_time.slice(0, 5).replace(":", "h")}</span>`
                   : `<span class="time-label-empty" onclick="openMeetingDateModal('${c.id}', '${c.meeting_date || ""}', '')" title="Schedule meeting">${calIcon}</span>`
               }
             </div>`;

        return `<div class="client-card" draggable="true" data-id="${c.id}">
          ${timeCol}
          <div class="client-col client-col-name">
            <div class="client-name">${name}</div>
          </div>
          <div class="client-col client-col-email">
            ${
              c.email
                ? `<a class="btn-contact btn-contact-mail" href="mailto:${emailVal}" title="Send email"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></a><span class="col-value">${c.email}</span><button class="btn-copy-field" title="Copy email" onclick="copyText('${emailVal}', this)"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>`
                : `<span class="col-empty">—</span>`
            }
          </div>
          <div class="client-col client-col-phone">
            ${
              c.phone
                ? `<a class="btn-contact btn-contact-wa" href="https://wa.me/${waNum}" target="_blank" title="Open WhatsApp"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg></a><span class="col-value">${c.phone}</span><button class="btn-copy-field" title="Copy phone" onclick="copyText('${phoneVal}', this)"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>`

      function renderClients(clients) {
        const list = document.getElementById("client-list");
        const tab = getActiveTab();
        clients = clients.filter((c) => clientTab(c) === tab);

        if (!clients.length) {
          list.innerHTML = `<div class="empty"><strong style="color:var(--muted)">Nothing here yet</strong></div>`;
          return;
        }

        if (tab === "upcoming") {
          clients.sort((a, b) => {
            if (!a.meeting_date && !b.meeting_date) return 0;
            if (!a.meeting_date) return 1;
            if (!b.meeting_date) return -1;
            if (a.meeting_date !== b.meeting_date) return new Date(a.meeting_date) - new Date(b.meeting_date);
            return (a.meeting_time || "").localeCompare(b.meeting_time || "");
          });

          // Group by date
          const groups = {};
          const noDate = [];
          clients.forEach((c) => {
            if (c.meeting_date) {
              (groups[c.meeting_date] = groups[c.meeting_date] || []).push(c);
            } else {
              noDate.push(c);
            }
          });

          let html = "";
          Object.keys(groups)
            .sort()
            .forEach((date) => {
              const d = new Date(date + "T00:00:00");
              const label = d.toLocaleDateString("en-ZA", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
              html += `<div class="date-divider"><span class="date-divider-label">${label}</span><div class="date-divider-line"></div></div>`;
              html += groups[date].map((c) => buildCard(c)).join("");
            });
          if (noDate.length) {
            html += `<div class="date-divider"><span class="date-divider-label">No date set</span><div class="date-divider-line"></div></div>`;
            html += noDate.map((c) => buildCard(c)).join("");
          }
          list.innerHTML = html;
        } else if (tab === "leads") {
          list.innerHTML = clients.map((c) => {
            const label = SOURCE_LABELS[c.source] || c.source || "—";
            return `<div class="lead-card-row">
              <div class="lead-source-col">${label}</div>
              ${buildCard(c)}
            </div>`;
          }).join("");
        } else {
          list.innerHTML = clients.map((c) => buildCard(c)).join("");
        }
      }

      window.filterClients = function () {
        const q = document.getElementById("search").value.toLowerCase();
        const filtered = allClients.filter((c) => `${c.first_name} ${c.last_name}`.toLowerCase().includes(q) || (c.email || "").toLowerCase().includes(q) || (c.phone || "").includes(q));
        renderClients(filtered);
        updateTabCounts();

      window.copyLink = function (link, btn) {
        navigator.clipboard.writeText(link).then(() => {

            btn.textContent = "Copy Questionnaire Link";
            btn.classList.remove("copied");
          }, 2000);
        });
      };

      window.copyText = function (text, btn) {
        navigator.clipboard.writeText(text).then(() => {
          const prev = btn.innerHTML;
          btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
          btn.classList.add("copied");
          setTimeout(() => {
            btn.innerHTML = prev;
            btn.classList.remove("copied");
          }, 1500);
        });
      };

      window.updateClient = async function () {
        const firstName = document.getElementById("m-first").value.trim();
        const lastName = document.getElementById("m-last").value.trim();
        const email = normaliseEmail(document.getElementById("m-email").value);
        const phone = normalisePhone(document.getElementById("m-phone").value);
        const notes = document.getElementById("m-notes").value.trim();
        const saveBtn = document.getElementById("btn-save");
        const errEl = document.getElementById("modal-error");

        errEl.classList.remove("visible");
        if (!firstName || !lastName) {
          errEl.textContent = "First and last name are required.";
          errEl.classList.add("visible");
          return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";

        const { error } = await supabase
          .from("clients")
          .update({
            first_name: firstName,
            last_name: lastName,
            email: email || null,
            phone: phone || null,
            notes: notes || null,
          })
          .eq("id", editingClientId);

        saveBtn.disabled = false;
        saveBtn.textContent = "Save Changes";

        if (error) {
          errEl.textContent = error.message;
          errEl.classList.add("visible");
          return;
        }

        const c = allClients.find((x) => x.id === editingClientId);
        if (c) {
          c.first_name = firstName;
          c.last_name = lastName;
          c.email = email || null;
          c.phone = phone || null;
          c.notes = notes || null;
        }

        closeModal();
        renderClients(allClients);
      };

      function normaliseEmail(v) {
        return v.trim().toLowerCase() || null;
      }
      function normalisePhone(v) {
        let s = v.trim().replace(/\s+/g, "").replace(/[().\-]/g, "");
        if (!s) return null;
        if (s.startsWith("0")) s = "+27" + s.slice(1);
        else if (s.startsWith("27") && !s.startsWith("+")) s = "+" + s;
        return s;
      }

      window.createClient = async function () {
        const firstName = document.getElementById("m-first").value.trim();
        const lastName = document.getElementById("m-last").value.trim();
        const email = normaliseEmail(document.getElementById("m-email").value);
        const phone = normalisePhone(document.getElementById("m-phone").value);
        const notes = document.getElementById("m-notes").value.trim();
        const saveBtn = document.getElementById("btn-save");
        const errEl = document.getElementById("modal-error");

        errEl.classList.remove("visible");

        if (!firstName || !lastName) {
          errEl.textContent = "First and last name are required.";
          errEl.classList.add("visible");
          return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = "Creating…";

        const { data: created, error } = await supabase
          .from("clients")
          .insert({
            advisor_id: advisorId,
            first_name: firstName,
            last_name: lastName,
            email: email || null,
            phone: phone || null,
            notes: notes || null,
            tab: "action-you",
          })
          .select("id")
          .single();

        saveBtn.disabled = false;
        saveBtn.textContent = "Create Client";

        if (error) {
          errEl.textContent = error.message;
          errEl.classList.add("visible");
          return;
        }

        closeModal();
        loadClients();
      };

        saveBtn.textContent = "Saving…";

      const SOURCE_TO_CALC = {

        education_callback:    "education",
        loan_callback:         "loan",
        life_cover_callback:   "life-cover-calc",
        holiday_callback:      "holiday",
        future_value_callback: "future-value",
        cgt_callback:          "cgt",
        // legacy
        retirement:            "retirement",
        investment:            "investment",
        tfsa:                  "tfsa",

      window.openQuestionnaire = async function () {
        if (!panelClientId) return;
        const { data: submissions } = await supabase
          .from("lead_magnets")
          .select("source, answers")
          .eq("contact_id", panelClientId)
          .order("created_at", { ascending: false })
          .limit(1);
        const submission = submissions?.[0];
        if (!submission) return;

        const calcId = SOURCE_TO_CALC[submission.source];
        if (!calcId) return;

        sessionStorage.setItem("calc_prefill", JSON.stringify({
          calculator: calcId,
          values: submission.answers,
        }));

        // Mark as read
        await supabase.from("clients").update({ questionnaire_unread: false }).eq("id", panelClientId);
        const c = allClients.find((x) => x.id === panelClientId);
        if (c) c.questionnaire_unread = false;

        closeRowPanel();
        renderClients(allClients);
        location.href = `./thesteward.html?calc=${calcId}`;

      rowPanelDelete.addEventListener("click", async () => {

        if (!rowPanelDelete.classList.contains("confirming")) {
          rowPanelDelete.classList.add("confirming");
          return;
        }
        rowPanelDelete.disabled = true;
        const { error } = await supabase.from("clients").delete().eq("id", panelClientId);
        if (!error) {
          allClients = allClients.filter((c) => c.id !== panelClientId);
          closeRowPanel();
          renderClients(allClients);
        } else {
          rowPanelDelete.disabled = false;
        }
      });

      // ── Tab assignments (localStorage) ───────────────────────────────────────
      function clientTab(c) {
        return c.tab || "clients";
      }

      function setTabAssignment(clientId, tab) {
        const c = allClients.find((x) => x.id === clientId);
        if (c) c.tab = tab;
        supabase.from("clients").update({ tab }).eq("id", clientId)
          .then(({ error }) => { if (error) console.error("setTabAssignment failed:", error.message); });
      }

      function getActiveTab() {
        return document.querySelector(".tab.active")?.dataset.tab || "clients";
      }

      function updateTabCounts() {
        ["upcoming", "action-you", "action-client", "clients", "leads", "no-move"].forEach((tab) => {
          const count = allClients.filter((c) => clientTab(c) === tab).length;
          const el = document.getElementById(`count-${tab}`);
          if (el) el.textContent = count;
        });
      }

      // ── Tab switching ─────────────────────────────────────────────────────────
      function setActiveView() {
        renderClients(allClients);
      }

      document.getElementById("tab-bar").addEventListener("click", (e) => {
        const tab = e.target.closest(".tab");
        if (!tab) return;
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        setActiveView();
      });

      // ── Drag and drop onto tabs ───────────────────────────────────────────────
      let dragClientId = null;
      let dragGhostEl = null;

      const transparentImg = new Image();
      transparentImg.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

      function createDragGhost(name) {
        const el = document.createElement("div");
        el.className = "drag-ghost-el";
        el.innerHTML = `
        <span class="ghost-label">${name}</span>
        <span class="ghost-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
        </span>`;
        el.style.left = "-200px";
        el.style.top = "-200px";
        document.body.appendChild(el);
        return el;
      }

      function moveDragGhost(x, y) {
        if (!dragGhostEl) return;
        dragGhostEl.style.left = x + 14 + "px";
        dragGhostEl.style.top = y - 18 + "px";
      }

      function removeDragGhost() {
        if (dragGhostEl) {
          dragGhostEl.remove();
          dragGhostEl = null;
        }
      }

      document.addEventListener("dragover", (e) => moveDragGhost(e.clientX, e.clientY));

      document.getElementById("client-list").addEventListener("dragstart", (e) => {
        const card = e.target.closest(".client-card");
        if (!card) return;
        dragClientId = card.dataset.id;
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setDragImage(transparentImg, 0, 0);
        const nameEl = card.querySelector(".client-name");
        const name = nameEl ? nameEl.textContent : "Client";
        dragGhostEl = createDragGhost(name);
        setTimeout(() => card.classList.add("dragging"), 0);
      });

      document.getElementById("client-list").addEventListener("dragend", (e) => {
        const card = e.target.closest(".client-card");
        if (card) card.classList.remove("dragging");
        removeDragGhost();
        document.querySelectorAll(".tab.drag-over").forEach((t) => t.classList.remove("drag-over"));
      });

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          tab.classList.add("drag-over");
          if (dragGhostEl) dragGhostEl.classList.add("is-drop");
        });
        tab.addEventListener("dragleave", () => {
          tab.classList.remove("drag-over");
          if (dragGhostEl) dragGhostEl.classList.remove("is-drop");
        });
        tab.addEventListener("drop", (e) => {
          e.preventDefault();
          tab.classList.remove("drag-over");
          removeDragGhost();
          if (!dragClientId) return;
          const targetTab = tab.dataset.tab;
          const id = dragClientId;
          const sourceTab = clientTab(allClients.find((x) => x.id === id) || {});
          dragClientId = null;
          if (sourceTab === "upcoming" && targetTab !== "upcoming") {
            supabase.from("clients").update({ meeting_date: null, meeting_time: null }).eq("id", id);
            const c = allClients.find((x) => x.id === id);
            if (c) { c.meeting_date = null; c.meeting_time = null; }
          }
          setTabAssignment(id, targetTab);
          updateTabCounts();
          renderClients(allClients);
        });
      });

      // ── Meeting date modal ────────────────────────────────────────────────────

      // Populate hour + minute selects once
      (function buildTimeSelects() {
        function fillSelects(hourId, minId) {
          const hourSel = document.getElementById(hourId);
          const minSel = document.getElementById(minId);
          for (let h = 6; h <= 20; h++) {
            const opt = document.createElement("option");
            opt.value = String(h).padStart(2, "0");
            opt.textContent = String(h).padStart(2, "0");
            hourSel.appendChild(opt);
          }
          ["00", "15", "30", "45"].forEach((m) => {
            const opt = document.createElement("option");
            opt.value = m;
            opt.textContent = m;
            minSel.appendChild(opt);
          });
          hourSel.value = "09";
        }
        fillSelects("md-hour", "md-min");
      })();

      let pendingUpcomingClientId = null;

      window.openMeetingDateModal = function (clientId, existingDate, existingTime) {
        pendingUpcomingClientId = clientId;
        const isEditing = !!(existingDate && existingTime);

        document.querySelector("#meeting-date-modal h2").textContent = isEditing ? "Edit Meeting" : "Schedule Meeting";
        document.getElementById("md-date").value = existingDate || new Date().toISOString().split("T")[0];

        if (existingTime) {
          const [h, m] = existingTime.split(":");
          document.getElementById("md-hour").value = h;
          const mins = ["00", "15", "30", "45"];
          const snapped = mins.reduce((prev, cur) => (Math.abs(+cur - +m) < Math.abs(+prev - +m) ? cur : prev));
          document.getElementById("md-min").value = snapped;
        } else {
          document.getElementById("md-hour").value = "09";
          document.getElementById("md-min").value = "00";
        }

        document.getElementById("md-error").classList.remove("visible");
        document.getElementById("md-save-btn").disabled = false;
        document.getElementById("md-clear-btn").style.display = isEditing ? "" : "none";
        document.getElementById("meeting-date-modal").classList.add("open");
      };

      window.closeMeetingDateModal = function () {
        document.getElementById("meeting-date-modal").classList.remove("open");
        pendingUpcomingClientId = null;
      };

      window.clearMeetingDate = async function () {
        if (!pendingUpcomingClientId) return;
        await supabase.from("clients").update({ meeting_date: null, meeting_time: null }).eq("id", pendingUpcomingClientId);
        const c = allClients.find((x) => x.id === pendingUpcomingClientId);
        if (c) { c.meeting_date = null; c.meeting_time = null; }
        closeMeetingDateModal();
        renderClients(allClients);
      };

      window.confirmMeetingDate = async function () {
        const dateVal = document.getElementById("md-date").value;
        const hour = document.getElementById("md-hour").value;
        const min = document.getElementById("md-min").value;
        const timeVal = hour && min ? `${hour}:${min}` : null;
        const errEl = document.getElementById("md-error");
        errEl.classList.remove("visible");
        if (!dateVal) {
          errEl.textContent = "Please pick a meeting date.";
          errEl.classList.add("visible");
          return;
        }
        const saveBtn = document.getElementById("md-save-btn");
        saveBtn.disabled = true;
        const { error } = await supabase.from("clients").update({ meeting_date: dateVal, meeting_time: timeVal }).eq("id", pendingUpcomingClientId);
        saveBtn.disabled = false;
        if (error) {
          errEl.textContent = error.message;
          errEl.classList.add("visible");
          return;
        }
        const c = allClients.find((x) => x.id === pendingUpcomingClientId);
        if (c) {
          c.meeting_date = dateVal;
          c.meeting_time = timeVal;
        }
        setTabAssignment(pendingUpcomingClientId, "upcoming");
        closeMeetingDateModal();
        updateTabCounts();
        renderClients(allClients);
      };


      document.getElementById("meeting-date-modal").addEventListener("click", function (e) {
        if (e.target === this) closeMeetingDateModal();
      });

      // ── Close modal on backdrop click ─────────────────────────────────────────
      document.getElementById("modal").addEventListener("click", function (e) {
        if (e.target === this) closeModal();
      });

      // ── Init ──────────────────────────────────────────────────────────────────
      loadClients();
    </script>
  </body>
</html>
